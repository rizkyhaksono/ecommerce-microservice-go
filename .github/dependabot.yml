# Dependabot version updates for every module, service image, and workflow.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /pkg
      - /services/catalog
      - /services/gateway
      - /services/order
      - /services/user
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /services/catalog
      - /services/gateway
      - /services/order
      - /services/user
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
